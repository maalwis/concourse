                echo "Running deploy-frontend-dev"
                date
                echo "================================"

  - name: deploy-frontend-qa
    plan:
      - get: every-minute
        trigger: true
      - task: deploy
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
