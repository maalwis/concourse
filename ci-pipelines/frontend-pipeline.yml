resources:
  - name: every-minute
    type: time
    source:
      interval: 5m

groups:
  - name: development
    jobs:
      - build-frontend
      - test-frontend
      - deploy-frontend-dev
      - deploy-frontend-qa

  - name: production
    jobs:
      - lint-frontend
      - deploy-frontend-staging
      - deploy-frontend-production

jobs:
  - name: build-frontend
    plan:
      - get: every-minute
        trigger: true
      - task: build
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: alpine
          run:
            path: sh
            args:
              - -exc
              - |
                echo "================================"
                echo "FRONTEND - BUILD"
                echo "Running build-frontend"
                date
                echo "================================"

  - name: test-frontend
    plan:
      - get: every-minute
        trigger: true
      - task: test
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
